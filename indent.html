<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Plans</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        #plans-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .plan-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .plan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .plan-name {
            font-size: 1.5em;
            color: #2563eb;
            margin-bottom: 10px;
        }
        .plan-price {
            font-size: 2em;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 10px;
        }
        .plan-speed {
            color: #666;
            margin-bottom: 5px;
        }
        .plan-feature {
            color: #555;
            margin: 5px 0;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #666;
        }
        .error {
            text-align: center;
            color: #dc2626;
            padding: 20px;
        }
        .provider-section {
            margin-bottom: 30px;
        }
        .provider-header {
            font-size: 1.8em;
            color: #1e40af;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #3b82f6;
        }
        .provider-plans {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                    gap: 20px;
                }
        
                /* Filters */
                .filters {
                    background: white;
                    padding: 20px;
                    border-radius: 10px;
                    margin-bottom: 20px;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                }
                .search-bar {
                    width: 100%;
                    padding: 12px;
                    font-size: 16px;
                    border: 2px solid #ddd;
                    border-radius: 8px;
                    margin-bottom: 15px;
                }
                .search-bar:focus {
                    border-color: #3b82f6;
                    outline: none;
                }
                .filter-group {
                    display: inline-block;
                    margin-right: 20px;
                    margin-bottom: 10px;
                }
                .filter-group label {
                    display: block;
                    font-weight: bold;
                    margin-bottom: 5px;
                    color: #333;
                }
                .filter-group input[type="number"] {
                    width: 80px;
                    padding: 8px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                }
                .filter-group select {
                    padding: 8px 12px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    background: white;
                }
                .provider-checkboxes {
                    margin-top: 10px;
                }
                .provider-checkbox {
                    display: inline-block;
                    margin-right: 15px;
                }
                .provider-checkbox input {
                    margin-right: 5px;
                }
                .btn-reset {
                    background: #6b7280;
                    color: white;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 5px;
                    cursor: pointer;
                    margin-top: 10px;
                }
                .btn-reset:hover {
                    background: #4b5563;
                }
        
                /* Speed tier colors */
                .speed-basic { border-left: 4px solid #3b82f6; }
                .speed-standard { border-left: 4px solid #8b5cf6; }
                .speed-fast { border-left: 4px solid #ec4899; }
                .speed-superfast { border-left: 4px solid #f59e0b; }
                .speed-ultrafast { border-left: 4px solid #dc2626; }
        
                /* Best value badge */
                .best-value {
                    position: absolute;
                    top: 10px;
                    right: 10px;
                    background: #10b981;
                    color: white;
                    padding: 5px 10px;
                    border-radius: 20px;
                    font-size: 12px;
                    font-weight: bold;
                }
        
                /* Promo badge */
                .promo-badge {
                    background: #ef4444;
                    color: white;
                    padding: 3px 8px;
                    border-radius: 4px;
                    font-size: 11px;
                    margin-left: 8px;
                }
        
                /* Plan card expand */
                .plan-card {
                    position: relative;
                    cursor: pointer;
                }
                .plan-details {
                    display: none;
                    margin-top: 15px;
                    padding-top: 15px;
                    border-top: 1px solid #eee;
                }
                .plan-card.expanded .plan-details {
                    display: block;
                }
                .detail-row {
                    display: flex;
                    justify-content: space-between;
                    margin: 5px 0;
                    font-size: 14px;
                }
                .detail-label {
                    color: #666;
                }
                .detail-value {
                    font-weight: bold;
                    color: #333;
                }
        
                /* Compare section */
                .compare-section {
                    background: #fef3c7;
                    padding: 20px;
                    border-radius: 10px;
                    margin-bottom: 20px;
                    border: 2px solid #f59e0b;
                }
                .compare-container {
                    display: flex;
                    gap: 20px;
                    margin-top: 15px;
                    overflow-x: auto;
                }
                .compare-card {
                    background: white;
                    padding: 15px;
                    border-radius: 8px;
                    min-width: 200px;
                    position: relative;
                }
                .compare-card .remove-compare {
                    position: absolute;
                    top: 5px;
                    right: 5px;
                    background: #ef4444;
                    color: white;
                    border: none;
                    width: 25px;
                    height: 25px;
                    border-radius: 50%;
                    cursor: pointer;
                }
                .btn-clear {
                    background: #ef4444;
                    color: white;
                    border: none;
                    padding: 8px 16px;
                    border-radius: 5px;
                    cursor: pointer;
                    margin-top: 10px;
                }
        
                /* Statistics */
                .stats {
                    display: flex;
                    gap: 20px;
                    margin-bottom: 20px;
                    flex-wrap: wrap;
                }
                .stat-card {
                    background: white;
                    padding: 15px 25px;
                    border-radius: 10px;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                    text-align: center;
                }
                .stat-value {
                    font-size: 2em;
                    font-weight: bold;
                    color: #2563eb;
                }
                .stat-label {
                    color: #666;
                    font-size: 14px;
                }
        
                /* Checkbox for compare */
                .compare-checkbox {
                            position: absolute;
                            top: 10px;
                            left: 10px;
                        }
        
                        .export-buttons {
                            display: inline-block;
                            margin-left: 20px;
                        }
                        .btn-export {
                            background: #2563eb;
                            color: white;
                            border: none;
                            padding: 10px 20px;
                            border-radius: 5px;
                            cursor: pointer;
                            margin-left: 10px;
                        }
                        .btn-export:hover {
                            background: #1d4ed8;
                        }
                    </style>
</head>
<body>
    <h1>ISP Plans</h1>
    
        <!-- Search and Filters -->
        <div class="filters">
            <input type="text" id="search" class="search-bar" placeholder="Search plans or providers...">
            <div class="filter-group">
                <label>Price Range:</label>
                <input type="number" id="min-price" placeholder="Min" min="0">
                <input type="number" id="max-price" placeholder="Max" min="0">
            </div>
            <div class="filter-group">
                <label>Speed (Mbps):</label>
                <select id="speed-filter">
                    <option value="">All Speeds</option>
                    <option value="25">25 Mbps</option>
                    <option value="50">50 Mbps</option>
                    <option value="100">100 Mbps</option>
                    <option value="250">250 Mbps</option>
                    <option value="500">500 Mbps</option>
                    <option value="1000">1000 Mbps</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Data:</label>
                <select id="data-filter">
                    <option value="">All</option>
                    <option value="unlimited">Unlimited</option>
                    <option value="limited">Limited</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort By:</label>
                <select id="sort-filter">
                    <option value="provider">Provider</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="speed">Speed</option>
                </select>
            </div>
            <div class="filter-group provider-checkboxes" id="provider-filters"></div>
            <button id="reset-filters" class="btn-reset">Reset Filters</button>
                    <div class="export-buttons">
                        <button id="export-csv" class="btn-export">Export CSV</button>
                        <button id="export-json" class="btn-export">Export JSON</button>
                    </div>
                </div>
    
        <!-- Compare Section -->
        <div class="compare-section" id="compare-section" style="display: none;">
            <h3>Compare Plans (<span id="compare-count">0</span>/3)</h3>
            <div class="compare-container" id="compare-container"></div>
            <button id="clear-compare" class="btn-clear">Clear All</button>
        </div>
    
        <!-- Statistics -->
        <div class="stats" id="stats"></div>
    
        <div id="plans-container">
            <p class="loading">Loading plans...</p>
        </div>

    <script>
            let allPlans = [];
            let filteredPlans = [];
            let compareList = [];

            // Fetch plans on load
            fetch('http://localhost:5000/api/plans/all', {
                headers: {
                    'X-API-Key': 'ispPlans2024SecureKey123'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success && data.plans) {
                    allPlans = data.plans;
                    filteredPlans = [...allPlans];
                    initializeFilters();
                    displayStats();
                    displayPlans(filteredPlans);
                } else {
                    displayError('No data available');
                }
            })
            .catch(error => {
                displayError(error.message);
            });

            // Initialize filters
            function initializeFilters() {
                // Create provider checkboxes
                const providers = [...new Set(allPlans.map(p => p.provider || 'Unknown'))].sort();
                const providerContainer = document.getElementById('provider-filters');
                providerContainer.innerHTML = providers.map(p => 
                    `<label class="provider-checkbox"><input type="checkbox" value="${p}" checked> ${p}</label>`
                ).join('');

                // Add event listeners
                document.getElementById('search').addEventListener('input', applyFilters);
                document.getElementById('min-price').addEventListener('input', applyFilters);
                document.getElementById('max-price').addEventListener('input', applyFilters);
                document.getElementById('speed-filter').addEventListener('change', applyFilters);
                document.getElementById('data-filter').addEventListener('change', applyFilters);
                document.getElementById('sort-filter').addEventListener('change', applyFilters);
                document.getElementById('provider-filters').addEventListener('change', applyFilters);
                document.getElementById('reset-filters').addEventListener('click', resetFilters);
                document.getElementById('clear-compare').addEventListener('click', clearCompare);
            }

            // Apply all filters
            function applyFilters() {
                const search = document.getElementById('search').value.toLowerCase();
                const minPrice = parseFloat(document.getElementById('min-price').value) || 0;
                const maxPrice = parseFloat(document.getElementById('max-price').value) || Infinity;
                const speedFilter = document.getElementById('speed-filter').value;
                const dataFilter = document.getElementById('data-filter').value;
                const sortBy = document.getElementById('sort-filter').value;
                const selectedProviders = Array.from(document.querySelectorAll('#provider-filters input:checked')).map(cb => cb.value);

                filteredPlans = allPlans.filter(plan => {
                    // Search filter
                    const searchMatch = !search || 
                        (plan.name || '').toLowerCase().includes(search) || 
                        (plan.provider || '').toLowerCase().includes(search);
                
                    // Price filter
                    const price = parseFloat(plan.price) || 0;
                    const priceMatch = price >= minPrice && price <= maxPrice;
                
                    // Speed filter
                    const speed = parseInt(plan.speed) || 0;
                    const speedMatch = !speedFilter || speed >= parseInt(speedFilter);
                
                    // Data filter
                    const data = (plan.data || '').toLowerCase();
                    const dataMatch = !dataFilter || 
                        (dataFilter === 'unlimited' && data.includes('unlimited')) ||
                        (dataFilter === 'limited' && !data.includes('unlimited'));
                
                    // Provider filter
                    const providerMatch = selectedProviders.includes(plan.provider || 'Unknown');

                    return searchMatch && priceMatch && speedMatch && dataMatch && providerMatch;
                });

                // Sort
                filteredPlans.sort((a, b) => {
                    switch(sortBy) {
                        case 'price-low': return (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0);
                        case 'price-high': return (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0);
                        case 'speed': return (parseInt(b.speed) || 0) - (parseInt(a.speed) || 0);
                        default: return (a.provider || '').localeCompare(b.provider || '');
                    }
                });

                displayStats();
                displayPlans(filteredPlans);
            }

            // Reset all filters
            function resetFilters() {
                document.getElementById('search').value = '';
                document.getElementById('min-price').value = '';
                document.getElementById('max-price').value = '';
                document.getElementById('speed-filter').value = '';
                document.getElementById('data-filter').value = '';
                document.getElementById('sort-filter').value = 'provider';
                document.querySelectorAll('#provider-filters input').forEach(cb => cb.checked = true);
                applyFilters();
            }

            // Display statistics
            function displayStats() {
                const totalPlans = filteredPlans.length;
                const avgPrice = filteredPlans.length > 0 
                    ? (filteredPlans.reduce((sum, p) => sum + (parseFloat(p.price) || 0), 0) / filteredPlans.length).toFixed(2)
                    : 0;
                const providers = new Set(filteredPlans.map(p => p.provider)).size;

                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${totalPlans}</div>
                        <div class="stat-label">Total Plans</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">$${avgPrice}</div>
                        <div class="stat-label">Avg Price</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${providers}</div>
                        <div class="stat-label">Providers</div>
                    </div>
                `;
            }

            // Get speed tier class
            function getSpeedClass(speed) {
                const s = parseInt(speed) || 0;
                if (s <= 25) return 'speed-basic';
                if (s <= 50) return 'speed-standard';
                if (s <= 100) return 'speed-fast';
                if (s <= 500) return 'speed-superfast';
                return 'speed-ultrafast';
            }

            // Calculate price per Mbps
            function getPricePerMbps(plan) {
                const price = parseFloat(plan.price) || 0;
                const speed = parseInt(plan.speed) || 1;
                return price / speed;
            }

            // Find best value plans
            function findBestValues(plans) {
                const bySpeed = {};
                plans.forEach(plan => {
                    const speed = parseInt(plan.speed) || 0;
                    if (!bySpeed[speed] || getPricePerMbps(plan) < getPricePerMbps(bySpeed[speed])) {
                        bySpeed[speed] = plan;
                    }
                });
                return new Set(Object.values(bySpeed).map(p => p.id || p.name));
            }

            // Display plans
            function displayPlans(plans) {
                const container = document.getElementById('plans-container');
                container.innerHTML = '';

                if (!plans || plans.length === 0) {
                    container.innerHTML = '<p class="error">No plans match your filters</p>';
                    return;
                }

                const bestValueIds = findBestValues(plans);

                // Group by provider
                const plansByProvider = {};
                plans.forEach(plan => {
                    const provider = plan.provider || 'Unknown';
                    if (!plansByProvider[provider]) plansByProvider[provider] = [];
                    plansByProvider[provider].push(plan);
                });

                for (const [provider, providerPlans] of Object.entries(plansByProvider)) {
                    const section = document.createElement('div');
                    section.className = 'provider-section';
                
                    const header = document.createElement('h2');
                    header.className = 'provider-header';
                    header.textContent = `${provider} (${providerPlans.length} plans)`;
                    section.appendChild(header);

                    const plansGrid = document.createElement('div');
                    plansGrid.className = 'provider-plans';

                    providerPlans.forEach((plan, index) => {
                        const card = document.createElement('div');
                        const speedClass = getSpeedClass(plan.speed);
                        const isBestValue = bestValueIds.has(plan.id || plan.name);
                        const isInCompare = compareList.some(c => (c.id || c.name) === (plan.id || plan.name));
                    
                        card.className = `plan-card ${speedClass}`;
                        card.innerHTML = `
                            ${isBestValue ? '<div class="best-value">★ Best Value</div>' : ''}
                            <input type="checkbox" class="compare-checkbox" ${isInCompare ? 'checked' : ''} data-plan='${JSON.stringify(plan)}'>
                            <div class="plan-name">${plan.name || 'Plan'}</div>
                            <div class="plan-price">$${plan.price || '0'}/mo</div>
                            <div class="plan-speed">Speed: ${plan.speed || 'N/A'} Mbps</div>
                            <div class="plan-feature">Data: ${plan.data || 'Unlimited'}</div>
                            <div class="plan-feature">${plan.features || ''}</div>
                            <div class="plan-details">
                                <div class="detail-row"><span class="detail-label">Setup Fee:</span><span class="detail-value">${plan.setup_fee || '$0'}</span></div>
                                <div class="detail-row"><span class="detail-label">Modem:</span><span class="detail-value">${plan.modem || 'Optional'}</span></div>
                                <div class="detail-row"><span class="detail-label">Contract:</span><span class="detail-value">${plan.contract || 'No lock-in'}</span></div>
                                <div class="detail-row"><span class="detail-label">$/Mbps:</span><span class="detail-value">$${getPricePerMbps(plan).toFixed(2)}</span></div>
                            </div>
                        `;
                    
                        // Click to expand
                        card.addEventListener('click', (e) => {
                            if (e.target.classList.contains('compare-checkbox')) return;
                            card.classList.toggle('expanded');
                        });

                        // Compare checkbox
                        const checkbox = card.querySelector('.compare-checkbox');
                        checkbox.addEventListener('change', (e) => {
                            e.stopPropagation();
                            toggleCompare(plan);
                        });

                        plansGrid.appendChild(card);
                    });

                    section.appendChild(plansGrid);
                    container.appendChild(section);
                }
            }

            // Toggle compare
            function toggleCompare(plan) {
                const planId = plan.id || plan.name;
                const index = compareList.findIndex(p => (p.id || p.name) === planId);
            
                if (index > -1) {
                    compareList.splice(index, 1);
                } else if (compareList.length < 3) {
                    compareList.push(plan);
                }
            
                updateCompareSection();
                displayPlans(filteredPlans);
            }

            // Update compare section
            function updateCompareSection() {
                const section = document.getElementById('compare-section');
                const container = document.getElementById('compare-container');
                const countSpan = document.getElementById('compare-count');
            
                if (compareList.length === 0) {
                    section.style.display = 'none';
                    return;
                }
            
                section.style.display = 'block';
                countSpan.textContent = compareList.length;
            
                container.innerHTML = compareList.map(plan => `
                    <div class="compare-card">
                        <button class="remove-compare" onclick="removeFromCompare('${plan.id || plan.name}')">×</button>
                        <div class="plan-name">${plan.name}</div>
                        <div class="plan-price">$${plan.price}/mo</div>
                        <div>Speed: ${plan.speed} Mbps</div>
                        <div>Data: ${plan.data}</div>
                        <div>Provider: ${plan.provider}</div>
                        <div>$/Mbps: $${getPricePerMbps(plan).toFixed(2)}</div>
                    </div>
                `).join('');
            }

            // Remove from compare
            window.removeFromCompare = function(planId) {
                compareList = compareList.filter(p => (p.id || p.name) !== planId);
                updateCompareSection();
                displayPlans(filteredPlans);
            };

            // Clear compare
                    function clearCompare() {
                        compareList = [];
                        updateCompareSection();
                        displayPlans(filteredPlans);
                    }

                    // Export to CSV
                    document.getElementById('export-csv').addEventListener('click', () => {
                        if (filteredPlans.length === 0) return;
            
                        const headers = ['Provider', 'Plan Name', 'Price', 'Speed', 'Data', 'Setup Fee', 'Modem', 'Contract'];
                        const rows = filteredPlans.map(p => [
                            p.provider || '',
                            p.name || '',
                            p.price || '',
                            p.speed || '',
                            p.data || '',
                            p.setup_fee || '',
                            p.modem || '',
                            p.contract || ''
                        ]);
            
                        const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
                        downloadFile(csv, 'isp-plans.csv', 'text/csv');
                    });

                    // Export to JSON
                    document.getElementById('export-json').addEventListener('click', () => {
                        if (filteredPlans.length === 0) return;
            
                        const json = JSON.stringify(filteredPlans, null, 2);
                        downloadFile(json, 'isp-plans.json', 'application/json');
                    });

                    // Download helper
                    function downloadFile(content, filename, type) {
                        const blob = new Blob([content], { type });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        a.click();
                        URL.revokeObjectURL(url);
                    }

                    function displayError(message) {
                const container = document.getElementById('plans-container');
                container.innerHTML = `<p class="error">Error: ${message}</p>`;
            }
        </script>
</body>
</html>
