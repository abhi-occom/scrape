<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISP Scraper Agent</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
  .wrap { padding: 12px 12px 100px; }
  h1 { font-size: 1rem; margin: 0 0 2px; }
  .sub { color: #94a3b8; font-size: 0.78rem; margin-bottom: 12px; }
  .status { font-size: 0.72rem; color: #64748b; margin-bottom: 10px; }
  .status.offline { color: #f87171; }
  .msg { margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; line-height: 1.4; font-size: 0.88rem; }
  .msg.user { background: #1e293b; }
  .msg.agent { background: #172554; }
  .msg.agent p { margin: 0 0 6px; }
  .msg.agent ul { margin: 4px 0; padding-left: 18px; }
  table.plan-table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: 0.76rem; }
  table.plan-table th, table.plan-table td { border: 1px solid #334155; padding: 3px 6px; text-align: left; }
  table.plan-table th { background: #1e3a5f; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #334155; padding: 10px; display: flex; gap: 6px; }
  input[type=text] { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 0.85rem; }
  button { padding: 8px 14px; border-radius: 8px; border: none; background: #2563eb; color: white; font-size: 0.85rem; cursor: pointer; }
  button:disabled { background: #475569; cursor: not-allowed; }
  a { color: #60a5fa; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ISP Scraper Agent</h1>
  <p class="sub">e.g. "scrape TPG NBN plans" or "compare Superloop to Occom"</p>
  <div id="status" class="status">Checking connection to localhost:5000&hellip;</div>
  <div id="log"></div>
</div>

<form id="chat-form">
  <input type="text" id="message" placeholder="Type a request&hellip;" autocomplete="off">
  <button type="submit" id="send-btn">Send</button>
</form>

<script src="side_panel.js"></script>
</body>
</html>
