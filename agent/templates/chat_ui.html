<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISP Scraper Agent</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
  .msg { margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; line-height: 1.45; }
  .msg.user { background: #1e293b; margin-left: 15%; }
  .msg.agent { background: #172554; margin-right: 5%; }
  .msg.agent p { margin: 0 0 8px; }
  .msg.agent ul { margin: 4px 0; padding-left: 20px; }
  table.plan-table { border-collapse: collapse; width: 100%; margin: 8px 0 12px; font-size: 0.85rem; }
  table.plan-table th, table.plan-table td { border: 1px solid #334155; padding: 4px 8px; text-align: left; }
  table.plan-table th { background: #1e3a5f; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #334155; padding: 12px 16px; display: flex; gap: 8px; }
  form .inner { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; width: 100%; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 1rem; }
  button { padding: 10px 18px; border-radius: 8px; border: none; background: #2563eb; color: white; font-size: 1rem; cursor: pointer; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .examples { color: #64748b; font-size: 0.85rem; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ISP Scraper Agent</h1>
  <p class="sub">Type a request in plain English &mdash; e.g. "scrape TPG NBN plans" or "compare Superloop to Occom".</p>
  <div id="log"></div>
</div>

<form id="chat-form">
  <div class="inner">
    <input type="text" id="message" placeholder="e.g. compare TPG and Superloop NBN plans to Occom" autocomplete="off" autofocus>
    <button type="submit" id="send-btn">Send</button>
  </div>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('chat-form');
const input = document.getElementById('message');
const sendBtn = document.getElementById('send-btn');

function addMessage(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = html;
  log.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.innerText = text;
  return d.innerHTML;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage('user', `<p>${escapeHtml(message)}</p>`);
  input.value = '';
  sendBtn.disabled = true;
  addMessage('agent', '<p><em>Working on it&hellip;</em></p>');
  const thinking = log.lastElementChild;

  try {
    const res = await fetch('/agent/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    thinking.remove();
    if (data.success) {
      addMessage('agent', data.reply.html);
    } else {
      addMessage('agent', `<p>Error: ${escapeHtml(data.error || 'unknown error')}</p>`);
    }
  } catch (err) {
    thinking.remove();
    addMessage('agent', `<p>Request failed: ${escapeHtml(String(err))}</p>`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
