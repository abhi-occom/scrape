<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISP Crawler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #162033;
      --muted: #607089;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.86);
      --line: rgba(255, 255, 255, 0.48);
      --primary: #175073;
      --accent: #CC4C3A;
      --accent-soft: rgba(204, 76, 58, 0.14);
      --primary-soft: rgba(23, 80, 115, 0.16);
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(23, 80, 115, 0.22), rgba(204, 76, 58, 0.2)),
        linear-gradient(120deg, #eef6f9 0%, #fff5f2 48%, #f4f9fb 100%);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Lightweight fallback if the Bootstrap CDN is unavailable locally. */
    .row { display: flex; flex-wrap: wrap; }
    .g-3 { gap: 1rem; }
    .g-4 { gap: 1.5rem; }
    .col-12 { flex: 0 0 100%; max-width: 100%; }
    .col-md-5, .col-md-7, .col-lg-5, .col-lg-7 { flex: 0 0 100%; max-width: 100%; }
    .p-4 { padding: 1.5rem; }
    .mt-3 { margin-top: 1rem; }
    .mt-4 { margin-top: 1.5rem; }
    .mb-0 { margin-bottom: 0; }
    .mb-1 { margin-bottom: .25rem; }
    .mb-3 { margin-bottom: 1rem; }
    .h4 { font-size: 1.35rem; }
    .text-secondary { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .d-grid { display: grid; }
    .d-flex { display: flex; }
    .gap-2 { gap: .5rem; }
    .flex-wrap { flex-wrap: wrap; }
    .align-middle { vertical-align: middle; }
    @media (min-width: 768px) {
      .col-md-5 { flex: 0 0 calc(41.666% - .5rem); max-width: calc(41.666% - .5rem); }
      .col-md-7 { flex: 0 0 calc(58.333% - .5rem); max-width: calc(58.333% - .5rem); }
    }
    @media (min-width: 992px) {
      .col-lg-5 { flex: 0 0 calc(41.666% - .75rem); max-width: calc(41.666% - .75rem); }
      .col-lg-7 { flex: 0 0 calc(58.333% - .75rem); max-width: calc(58.333% - .75rem); }
    }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .glass-panel {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(36, 56, 88, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .hero {
      padding: 28px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 0.96;
      letter-spacing: 0;
      margin: 0;
      max-width: 820px;
    }

    .hero p {
      color: var(--muted);
      max-width: 720px;
      margin: 18px 0 0;
      font-size: 1.02rem;
    }

    .accent-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      margin-bottom: 18px;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid rgba(23, 80, 115, 0.24);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--primary);
    }

    .form-control,
    .form-select {
      border: 1px solid rgba(52, 78, 112, 0.16);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.82);
    }

    .btn {
      border-radius: 8px;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: 0;
      box-shadow: 0 12px 28px rgba(23, 80, 115, 0.24);
    }

    .btn-outline-danger {
      background: rgba(255, 255, 255, 0.66);
    }

    .status-card {
      display: none;
      margin-top: 16px;
      border-radius: 8px;
      padding: 14px 16px;
      font-weight: 700;
    }

    .crawl-timer {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      color: var(--primary);
      background: rgba(255, 255, 255, 0.64);
      border: 1px solid rgba(23, 80, 115, 0.18);
      border-radius: 8px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .status-starting {
      color: #7c2d21;
      background: var(--accent-soft);
      border: 1px solid rgba(204, 76, 58, 0.32);
    }

    .status-success {
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid rgba(23, 80, 115, 0.28);
    }

    .status-error {
      color: #7c2d21;
      background: var(--accent-soft);
      border: 1px solid rgba(204, 76, 58, 0.32);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .export-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 4px;
    }

    .export-actions .btn {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(23, 80, 115, 0.18);
      color: var(--primary);
    }

    .export-actions .btn:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .metric {
      padding: 14px;
      background: var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 8px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 1.45rem;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid rgba(82, 103, 132, 0.14);
    }

    .table {
      margin: 0;
      min-width: 680px;
    }

    .table thead th {
      color: var(--primary);
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid rgba(82, 103, 132, 0.18);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .table tbody td {
      background: rgba(255, 255, 255, 0.52);
      vertical-align: middle;
    }

    .network-chip {
      display: inline-flex;
      max-width: 260px;
      padding: 4px 8px;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid rgba(23, 80, 115, 0.2);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: normal;
    }

    .empty-state {
      color: var(--muted);
      padding: 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.58);
      border-radius: 8px;
    }

    .crawler-grid {
      align-items: stretch;
    }

    .crawler-grid > section {
      display: flex;
    }

    .crawler-panel {
      width: 100%;
      height: 550px;
    }

    .saved-panel {
      display: flex;
      flex-direction: column;
      max-height: 550px;
    }

    .saved-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    @media (max-width: 768px) {
      .app-shell {
        width: min(100% - 20px, 1180px);
        padding: 20px 0;
      }

      .hero,
      .glass-panel {
        padding: 18px !important;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="hero glass-panel">
      <div class="accent-pill">Auto Discovery Crawler</div>
      <h1>ISP Mini Crawler</h1>
      <p>Enter an ISP website URL to discover plan pages, extract broadband prices, and review saved scrape runs from one dashboard.</p>
    </section>

    <div class="row g-4 crawler-grid">
      <section class="col-lg-5">
        <div class="glass-panel p-4 crawler-panel">
          <div class="panel-title">
            <h2>Start a Crawl</h2>
          </div>

          <form id="form" class="row g-3">
            <div class="col-12">
              <label class="form-label fw-bold" for="url">ISP URL</label>
              <input type="url" class="form-control form-control-lg" id="url" placeholder="https://example.com/plans" required>
            </div>
            <div class="col-md-7">
              <label class="form-label fw-bold" for="name">Provider Name</label>
              <input type="text" class="form-control" id="name" placeholder="Optional">
            </div>
            <div class="col-md-5">
              <label class="form-label fw-bold" for="depth">Depth</label>
              <select class="form-select" id="depth">
                <option value="1">1 level</option>
                <option value="2" selected>2 levels</option>
                <option value="3">3 levels</option>
              </select>
            </div>
            <div class="col-12 d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Start Crawling</button>
            </div>
          </form>

          <div id="status" class="status-card"></div>
          <div id="crawlTimer" class="crawl-timer">Elapsed: 00:00</div>
        </div>
      </section>

      <section class="col-lg-7">
        <div id="saved" class="glass-panel p-4 crawler-panel saved-panel">
          <div class="panel-title">
            <h2>Saved Scrapes</h2>
          </div>
          <div id="savedContent" class="saved-scroll">Loading saved data...</div>
        </div>
      </section>
    </div>

    <section id="results" class="glass-panel p-4 mt-4" style="display:none;">
      <div class="panel-title">
        <h2>Scraped Data</h2>
      </div>
      <div id="resultsContent"></div>
    </section>
  </main>

  <script>
let poll;
let timer;
let crawlStartedAt = 0;
let currentResultPayload = null;
let currentResultView = null;
let currentResultFilename = '';
const PLAN_COLUMNS = [
  'provider',
  'network_type',
  'plan_name',
  'download_speed',
  'upload_speed',
  'price',
  'promo_price',
  'promo_period',
  'contract',
  'typical_evening_dl',
  'typical_evening_ul',
  'source_url'
];
document.addEventListener('DOMContentLoaded', loadSavedResults);
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const url = document.getElementById('url').value;
  const name = document.getElementById('name').value;
  const depth = document.getElementById('depth').value;
  const networks = ['nbn','opticomm','redtrain','supa'];
  setStatus('Starting...', 'starting');
  startCrawlTimer();
  const res = await fetch('/isp/api/crawl', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url,name,networks,depth:parseInt(depth)})
  });
  const data = await res.json();
  if(data.success) {
    poll = setInterval(checkStatus, 2000);
  } else {
    stopCrawlTimer();
    setStatus('Error: ' + data.error, 'error');
  }
};
async function checkStatus() {
  const res = await fetch('/isp/api/status');
  const data = await res.json();
  if(!data.running && data.status !== 'idle') {
    clearInterval(poll);
    stopCrawlTimer(data.result?.duration_seconds);
    if(data.status === 'success') {
      setStatus(data.message, 'success');
      currentResultPayload = data.result || null;
      currentResultFilename = '';
      showResults(data.result);
      loadSavedResults();
    } else {
      setStatus('Error: ' + data.message, 'error');
      if(data.result) {
        currentResultPayload = data.result;
        currentResultFilename = '';
        showResults(data.result);
        loadSavedResults();
      }
    }
  } else if(data.running) {
    setStatus('Running: ' + data.message, 'starting');
    updateCrawlTimer();
  }
}

function setStatus(message, type) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  el.className = `status-card status-${type}`;
  el.textContent = message;
}

function startCrawlTimer() {
  crawlStartedAt = Date.now();
  updateCrawlTimer();
  clearInterval(timer);
  timer = setInterval(updateCrawlTimer, 1000);
}

function stopCrawlTimer(finalSeconds) {
  clearInterval(timer);
  timer = null;
  const elapsed = typeof finalSeconds === 'number'
    ? finalSeconds
    : Math.max(0, Math.round((Date.now() - crawlStartedAt) / 1000));
  const el = document.getElementById('crawlTimer');
  el.style.display = 'block';
  el.textContent = `Elapsed: ${formatElapsed(elapsed)}`;
}

function updateCrawlTimer() {
  if(!crawlStartedAt) {
    return;
  }
  const elapsed = Math.max(0, Math.floor((Date.now() - crawlStartedAt) / 1000));
  const el = document.getElementById('crawlTimer');
  el.style.display = 'block';
  el.textContent = `Elapsed: ${formatElapsed(elapsed)}`;
}

function formatElapsed(totalSeconds) {
  const seconds = Math.max(0, Math.round(totalSeconds));
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const hours = Math.floor(mins / 60);
  const remMins = mins % 60;
  if(hours > 0) {
    return `${String(hours).padStart(2, '0')}:${String(remMins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }
  return `${String(remMins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

async function loadSavedResults() {
  const saved = document.getElementById('savedContent');
  try {
    const res = await fetch('/isp/api/results');
    const data = await res.json();
    if(!data.success || !data.results || data.results.length === 0) {
      saved.innerHTML = '<div class="empty-state">No saved crawler results yet.</div>';
      return;
    }

    let html = '<div class="table-wrap"><table class="table table-hover align-middle"><thead><tr><th>Provider</th><th>Plans</th><th>Networks</th><th>Duration</th><th>Actions</th></tr></thead><tbody>';
    data.results.forEach((item, index) => {
      const filename = encodeURIComponent(item.filename);
      html += `<tr>
        <td><strong>${escapeHtml(item.provider || '')}</strong></td>
        <td>${item.plans_count || 0}</td>
        <td><span class="network-chip">${escapeHtml((item.networks || []).join(', ') || '-')}</span></td>
        <td>${item.duration || 0}s</td>
        <td>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-sm btn-primary" type="button" onclick="loadResultFile('${filename}')">${index === 0 ? 'Show Latest' : 'Show'}</button>
            <button class="btn btn-sm btn-outline-danger" type="button" onclick="deleteResultFile('${filename}')">Remove</button>
          </div>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    saved.innerHTML = html;

    if(document.getElementById('results').style.display === 'none') {
      loadResultFile(encodeURIComponent(data.results[0].filename));
    }
  } catch(e) {
    saved.innerHTML = '<div class="empty-state">Could not load saved crawler results.</div>';
  }
}

async function deleteResultFile(filename) {
  if(!confirm('Remove this saved scrape?')) {
    return;
  }

  const res = await fetch(`/isp/api/results/${filename}`, { method: 'DELETE' });
  const data = await res.json();
  if(data.success) {
    document.getElementById('results').style.display = 'none';
    document.getElementById('resultsContent').innerHTML = '';
    loadSavedResults();
  } else {
    alert(data.error || 'Could not remove saved scrape.');
  }
}

async function loadResultFile(filename) {
  const res = await fetch(`/isp/api/results/${filename}`);
  const data = await res.json();
  if(data.success) {
    const result = data.data;
    currentResultPayload = result;
    currentResultFilename = filename;
    showResults({
      valid_plans: result.summary?.valid_plans || 0,
      plan_pages_found: result.summary?.plan_pages_found || 0,
      urls_visited: result.summary?.urls_visited || 0,
      duration_seconds: result.duration_seconds || 0,
      plans: result.plans || [],
      provider: result.provider || '',
      base_url: result.base_url || ''
    });
  }
}

function showResults(r) {
  currentResultView = r || {};
  if(!currentResultPayload) {
    currentResultPayload = currentResultView;
  }
  document.getElementById('results').style.display='block';
  let html = '';
  if(r.provider || r.base_url) {
    html += `<div class="mb-3"><h3 class="h4 mb-1">${escapeHtml(r.provider || 'Scrape')}</h3><p class="text-secondary mb-0">${escapeHtml(r.base_url || '')}</p></div>`;
  }
  html += `<div class="export-actions">
    <button class="btn btn-sm" type="button" onclick="downloadCurrentJson()">Download JSON</button>
    <button class="btn btn-sm" type="button" onclick="downloadCurrentCsv()">Download CSV</button>
    <button class="btn btn-sm" type="button" onclick="copyCurrentApiResponse()">Copy API Response</button>
    <button class="btn btn-sm" type="button" onclick="compareCurrentResult()" ${currentResultFilename ? '' : 'disabled'}>Compare Previous</button>
  </div>`;
  html += `<div class="metric-grid">
    <div class="metric"><span>Plans Found</span><strong>${r.valid_plans || 0}</strong></div>
    <div class="metric"><span>URLs Crawled</span><strong>${r.urls_visited || 0}</strong></div>
    <div class="metric"><span>Pages Scraped</span><strong>${r.plan_pages_found || 0}</strong></div>
    <div class="metric"><span>Duration</span><strong>${r.duration_seconds || 0}s</strong></div>
  </div>`;
  if(r.plans && r.plans.length > 0) {
    html += '<div class="table-wrap mt-3"><table class="table table-hover align-middle"><thead><tr>';
    PLAN_COLUMNS.forEach(column => {
      html += `<th>${column}</th>`;
    });
    html += '</tr></thead><tbody>';
    r.plans.forEach(p => {
      html += '<tr>';
      PLAN_COLUMNS.forEach(column => {
        const value = normaliseDisplayValue(p, column);
        html += `<td>${escapeHtml(value)}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div class="empty-state">No valid plans were found in this scrape.</div>';
  }
  document.getElementById('resultsContent').innerHTML = html;
}

async function compareCurrentResult() {
  if(!currentResultFilename) {
    setStatus('Open a saved scrape before comparing previous runs.', 'error');
    return;
  }

  const res = await fetch(`/isp/api/results/${currentResultFilename}/compare`);
  const data = await res.json();
  if(!data.success) {
    renderComparisonMessage(data.error || 'Could not compare this run.');
    return;
  }
  renderComparison(data);
}

function renderComparisonMessage(message) {
  const existing = document.getElementById('comparisonPanel');
  if(existing) {
    existing.remove();
  }
  document.getElementById('resultsContent').insertAdjacentHTML(
    'beforeend',
    `<div id="comparisonPanel" class="comparison-panel mt-3"><div class="empty-state">${escapeHtml(message)}</div></div>`
  );
}

function renderComparison(data) {
  const existing = document.getElementById('comparisonPanel');
  if(existing) {
    existing.remove();
  }

  const summary = data.summary || {};
  const totalChanges = Object.values(summary).reduce((sum, value) => sum + Number(value || 0), 0);
  let html = `<div id="comparisonPanel" class="comparison-panel mt-3">
    <div class="panel-title mb-3">
      <h2>Compared With Previous Run</h2>
    </div>
    <p class="text-secondary mb-3">${escapeHtml(data.previous_file || '')} -> ${escapeHtml(data.current_file || '')}</p>
    <div class="metric-grid">
      <div class="metric"><span>New Plans</span><strong>${summary.new_plans || 0}</strong></div>
      <div class="metric"><span>Removed</span><strong>${summary.removed_plans || 0}</strong></div>
      <div class="metric"><span>Price Changes</span><strong>${summary.price_changed || 0}</strong></div>
      <div class="metric"><span>Promo Changes</span><strong>${summary.promo_changed || 0}</strong></div>
    </div>`;

  if(totalChanges === 0) {
    html += '<div class="empty-state">No changes from previous run.</div>';
  } else {
    html += renderPlanChangeTable('New Plans', data.changes?.new_plans || []);
    html += renderPlanChangeTable('Removed Plans', data.changes?.removed_plans || []);
    html += renderPriceChangeTable(data.changes?.price_changed || []);
    html += renderPromoChangeTable(data.changes?.promo_changed || []);
  }

  html += '</div>';
  document.getElementById('resultsContent').insertAdjacentHTML('beforeend', html);
}

function renderPlanChangeTable(title, plans) {
  if(!plans.length) {
    return '';
  }
  let html = `<h3 class="h4 mt-3">${escapeHtml(title)}</h3><div class="table-wrap mt-3"><table class="table table-hover align-middle"><thead><tr>
    <th>Plan</th><th>Network</th><th>Speed</th><th>Price</th><th>Promo</th>
  </tr></thead><tbody>`;
  plans.forEach(plan => {
    html += `<tr>
      <td>${escapeHtml(plan.plan_name || '')}</td>
      <td>${escapeHtml(plan.network_type || '')}</td>
      <td>${escapeHtml(formatSpeed(plan))}</td>
      <td>${escapeHtml(formatMoney(plan.price))}</td>
      <td>${escapeHtml(formatPromo(plan.promo_price, plan.promo_period))}</td>
    </tr>`;
  });
  return html + '</tbody></table></div>';
}

function renderPriceChangeTable(changes) {
  if(!changes.length) {
    return '';
  }
  let html = '<h3 class="h4 mt-3">Price Changed</h3><div class="table-wrap mt-3"><table class="table table-hover align-middle"><thead><tr><th>Plan</th><th>Network</th><th>Speed</th><th>Old Price</th><th>New Price</th></tr></thead><tbody>';
  changes.forEach(change => {
    html += `<tr>
      <td>${escapeHtml(change.plan?.plan_name || '')}</td>
      <td>${escapeHtml(change.plan?.network_type || '')}</td>
      <td>${escapeHtml(formatSpeed(change.plan || {}))}</td>
      <td>${escapeHtml(formatMoney(change.old_price))}</td>
      <td>${escapeHtml(formatMoney(change.new_price))}</td>
    </tr>`;
  });
  return html + '</tbody></table></div>';
}

function renderPromoChangeTable(changes) {
  if(!changes.length) {
    return '';
  }
  let html = '<h3 class="h4 mt-3">Promo Changed</h3><div class="table-wrap mt-3"><table class="table table-hover align-middle"><thead><tr><th>Plan</th><th>Network</th><th>Speed</th><th>Old Promo</th><th>New Promo</th></tr></thead><tbody>';
  changes.forEach(change => {
    html += `<tr>
      <td>${escapeHtml(change.plan?.plan_name || '')}</td>
      <td>${escapeHtml(change.plan?.network_type || '')}</td>
      <td>${escapeHtml(formatSpeed(change.plan || {}))}</td>
      <td>${escapeHtml(formatPromo(change.old_promo_price, change.old_promo_period))}</td>
      <td>${escapeHtml(formatPromo(change.new_promo_price, change.new_promo_period))}</td>
    </tr>`;
  });
  return html + '</tbody></table></div>';
}

function downloadCurrentJson() {
  const payload = currentResultPayload || currentResultView || {};
  const json = JSON.stringify(payload, null, 2);
  downloadTextFile(makeExportFilename('json'), json, 'application/json;charset=utf-8');
}

function downloadCurrentCsv() {
  const plans = (currentResultView?.plans || currentResultPayload?.plans || []);
  const csv = plansToCsv(plans);
  downloadTextFile(makeExportFilename('csv'), csv, 'text/csv;charset=utf-8');
}

async function copyCurrentApiResponse() {
  const payload = currentResultPayload || currentResultView || {};
  const text = JSON.stringify(payload, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    setStatus('API response copied to clipboard.', 'success');
  } catch(e) {
    fallbackCopyText(text);
    setStatus('API response copied to clipboard.', 'success');
  }
}

function plansToCsv(plans) {
  const rows = [PLAN_COLUMNS.join(',')];
  (plans || []).forEach(plan => {
    rows.push(PLAN_COLUMNS.map(column => csvCell(normaliseDisplayValue(plan, column))).join(','));
  });
  return rows.join('\r\n');
}

function csvCell(value) {
  const text = String(value ?? '');
  if(/[",\r\n]/.test(text)) {
    return `"${text.replace(/"/g, '""')}"`;
  }
  return text;
}

function downloadTextFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function makeExportFilename(extension) {
  const provider = (currentResultView?.provider || currentResultPayload?.provider || 'isp-crawl')
    .toString()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '') || 'isp-crawl';
  const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
  return `${provider}_${stamp}.${extension}`;
}

function fallbackCopyText(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.left = '-9999px';
  document.body.appendChild(area);
  area.select();
  document.execCommand('copy');
  area.remove();
}

function formatSpeed(plan) {
  const dl = plan.download_speed ?? '';
  const ul = plan.upload_speed ?? '';
  if(dl === '' && ul === '') {
    return '';
  }
  return `${dl}/${ul} Mbps`;
}

function formatMoney(value) {
  if(value === null || value === undefined || value === '') {
    return '-';
  }
  const number = Number(value);
  if(Number.isFinite(number)) {
    return `$${number.toFixed(2)}`;
  }
  return String(value);
}

function formatPromo(price, period) {
  if(price === null || price === undefined || price === '') {
    return period || '-';
  }
  return `${formatMoney(price)}${period ? ' / ' + period : ''}`;
}

function normaliseDisplayValue(plan, column) {
  if(column === 'provider') {
    return plan.provider || '';
  }
  if(column === 'typical_evening_dl') {
    return plan.typical_evening_dl ?? plan.download_speed ?? '';
  }
  if(column === 'typical_evening_ul') {
    return plan.typical_evening_ul ?? plan.upload_speed ?? '';
  }
  return plan[column] ?? '';
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}
