<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrape Health Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #162033;
      --muted: #607089;
      --glass: rgba(255, 255, 255, 0.76);
      --glass-strong: rgba(255, 255, 255, 0.88);
      --line: rgba(255, 255, 255, 0.5);
      --primary: #175073;
      --accent: #CC4C3A;
      --accent-soft: rgba(204, 76, 58, 0.14);
      --primary-soft: rgba(23, 80, 115, 0.16);
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(23, 80, 115, 0.22), rgba(204, 76, 58, 0.2)),
        linear-gradient(120deg, #eef6f9 0%, #fff5f2 48%, #f4f9fb 100%);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .glass-panel {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(36, 56, 88, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 0.96;
      letter-spacing: 0;
      margin: 0;
    }

    .hero p {
      color: var(--muted);
      max-width: 720px;
      margin: 18px 0 0;
      font-size: 1.02rem;
    }

    .accent-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      margin-bottom: 18px;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid rgba(23, 80, 115, 0.24);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .btn {
      border-radius: 8px;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: 0;
      box-shadow: 0 12px 28px rgba(23, 80, 115, 0.24);
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-title h2 {
      margin: 0;
      color: var(--primary);
      font-size: 1.12rem;
      font-weight: 800;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .metric {
      padding: 14px;
      background: var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 8px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 1.45rem;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid rgba(82, 103, 132, 0.14);
    }

    .table {
      margin: 0;
      min-width: 760px;
    }

    .table thead th {
      color: var(--primary);
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid rgba(82, 103, 132, 0.18);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .table tbody td {
      background: rgba(255, 255, 255, 0.52);
      vertical-align: middle;
    }

    .health-note {
      color: var(--muted);
      margin: 0;
      overflow-wrap: anywhere;
    }

    .health-status {
      display: inline-flex;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .health-status-good {
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid rgba(23, 80, 115, 0.2);
    }

    .health-status-watch {
      color: #7c2d21;
      background: var(--accent-soft);
      border: 1px solid rgba(204, 76, 58, 0.24);
    }

    .empty-state {
      color: var(--muted);
      padding: 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.58);
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .app-shell {
        width: min(100% - 20px, 1180px);
        padding: 20px 0;
      }

      .hero {
        align-items: stretch;
        display: grid;
        padding: 18px;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="hero glass-panel">
      <div>
        <div class="accent-pill">Saved Run Monitoring</div>
        <h1>Scrape Health Report</h1>
        <p>Review crawler reliability, duration, failed pages, plan volume, and latest changes across saved ISP scrape runs.</p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-primary" href="/isp/">Back to Crawler</a>
        <button class="btn btn-primary" type="button" onclick="loadHealthReport()">Refresh</button>
      </div>
    </section>

    <section class="glass-panel p-4">
      <div class="panel-title">
        <h2>Health Summary</h2>
      </div>
      <div id="healthContent" class="empty-state">Loading scrape health...</div>
    </section>
  </main>

  <script>
document.addEventListener('DOMContentLoaded', loadHealthReport);

async function loadHealthReport() {
  const box = document.getElementById('healthContent');
  try {
    const res = await fetch('/isp/api/health');
    const data = await res.json();
    if(!data.success || !data.health) {
      box.innerHTML = '<div class="empty-state">Could not load scrape health.</div>';
      return;
    }
    renderHealthReport(data.health);
  } catch(e) {
    box.innerHTML = '<div class="empty-state">Could not load scrape health.</div>';
  }
}

function renderHealthReport(health) {
  const box = document.getElementById('healthContent');
  if(!health.total_runs) {
    box.innerHTML = '<div class="empty-state">No saved crawler runs yet. Start a crawl from the main dashboard to build health metrics.</div>';
    return;
  }

  const changes = health.changes_since_last_run || {};
  const latest = health.latest_run || {};
  let html = `<div class="metric-grid">
    <div class="metric"><span>Success Rate</span><strong>${health.success_rate || 0}%</strong></div>
    <div class="metric"><span>Avg Duration</span><strong>${health.average_duration_seconds || 0}s</strong></div>
    <div class="metric"><span>Avg Plans</span><strong>${health.average_valid_plans || 0}</strong></div>
    <div class="metric"><span>Failed Pages</span><strong>${health.total_failed_pages || 0}</strong></div>
  </div>`;

  html += `<p class="health-note">Latest run: ${escapeHtml(latest.provider || '-')} (${escapeHtml(latest.filename || '-')}) with ${latest.valid_plans || 0} valid plans in ${latest.duration_seconds || 0}s. Total saved runs: ${health.total_runs || 0}; total API errors recorded: ${health.total_errors || 0}.</p>`;
  html += `<div class="metric-grid">
    <div class="metric"><span>New Since Last</span><strong>${changes.new_plans || 0}</strong></div>
    <div class="metric"><span>Removed</span><strong>${changes.removed_plans || 0}</strong></div>
    <div class="metric"><span>Price Changes</span><strong>${changes.price_changed || 0}</strong></div>
    <div class="metric"><span>Promo Changes</span><strong>${changes.promo_changed || 0}</strong></div>
  </div>`;

  const providers = Array.isArray(health.providers) ? health.providers : [];
  if(providers.length) {
    html += '<div class="table-wrap"><table class="table table-hover align-middle"><thead><tr><th>Provider</th><th>Status</th><th>Runs</th><th>Avg Duration</th><th>Latest Plans</th><th>Failed Pages</th><th>Changes</th></tr></thead><tbody>';
    providers.forEach(provider => {
      const providerChanges = provider.changes_since_last_run || {};
      const statusClass = Number(provider.success_rate || 0) >= 80 ? 'health-status-good' : 'health-status-watch';
      html += `<tr>
        <td><strong>${escapeHtml(provider.provider || '')}</strong><br><span class="text-secondary">${escapeHtml(provider.latest_filename || '')}</span></td>
        <td><span class="health-status ${statusClass}">${provider.success_rate || 0}%</span></td>
        <td>${provider.successful_runs || 0}/${provider.runs || 0}</td>
        <td>${provider.average_duration_seconds || 0}s</td>
        <td>${provider.latest_valid_plans || 0}</td>
        <td>${provider.total_failed_pages || 0}</td>
        <td>new ${providerChanges.new_plans || 0}, removed ${providerChanges.removed_plans || 0}, price ${providerChanges.price_changed || 0}, promo ${providerChanges.promo_changed || 0}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }

  const failures = Array.isArray(health.recent_failures) ? health.recent_failures : [];
  if(failures.length) {
    html += '<p class="health-note mt-3">Recent failed runs: ' + escapeHtml(failures.map(item => `${item.provider} (${item.filename})`).join(' | ')) + '</p>';
  }

  box.innerHTML = html;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
