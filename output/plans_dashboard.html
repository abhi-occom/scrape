<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Plans Dashboard - Kogan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #666;
            margin: 0;
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px 10px 0 0 !important;
            padding: 15px 20px;
        }
        
        .card-title {
            margin: 0;
            font-weight: bold;
        }
        
        .plan-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            margin-right: 5px;
        }
        
        .price-highlight {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .table-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        table {
            margin: 0;
        }
        
        table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        table tbody tr {
            border-bottom: 1px solid #eee;
        }
        
        table tbody tr:hover {
            background-color: #f9f9f9;
        }
        
        .features-list {
            font-size: 0.9rem;
            color: #666;
        }
        
        .features-list li {
            margin-bottom: 5px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .card {
                margin-bottom: 15px;
            }
            
            .price-highlight {
                font-size: 1.2rem;
            }
            
            table {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 ISP Plans Dashboard</h1>
            <p>Real-time internet plan comparison and pricing</p>
        </div>
        
        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p style="margin-top: 10px;">Loading plans data...</p>
        </div>
        
        <!-- Error State -->
        <div id="error" class="error" style="display: none;"></div>
        
        <!-- Content -->
        <div id="content" style="display: none;">
            <!-- Statistics -->
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="total-plans">0</div>
                    <div class="stat-label">Total Plans</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avg-price">$0</div>
                    <div class="stat-label">Average Price</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="min-price">$0</div>
                    <div class="stat-label">Min Price</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="max-price">$0</div>
                    <div class="stat-label">Max Price</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="scraped-time">-</div>
                    <div class="stat-label">Last Updated</div>
                </div>
            </div>
            
            <!-- Plans Table -->
            <div class="table-container" style="margin-top: 30px;">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Plan Name</th>
                            <th>Speed</th>
                            <th>Duration</th>
                            <th>Monthly Price</th>
                            <th>Total Cost</th>
                            <th>Features</th>
                        </tr>
                    </thead>
                    <tbody id="plans-tbody">
                        <!-- Plans will be inserted here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Cards View -->
            <div class="row" id="cards-view" style="margin-top: 30px;">
                <!-- Cards will be inserted here -->
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch the latest JSON file
        async function loadPlansData() {
            try {
                // Get list of files in the json directory
                const response = await fetch('../scrape_isp_kogan/json/');
                
                // For now, try to load the most recent file
                // In a real app, we'd list the directory and get the latest
                const latestFile = 'kogan_plans_20260513_232252.json';
                
                const dataResponse = await fetch(`../scrape_isp_kogan/json/${latestFile}`);
                if (!dataResponse.ok) {
                    throw new Error('Failed to load data file');
                }
                
                const data = await dataResponse.json();
                displayPlans(data);
                
            } catch (error) {
                console.error('Error loading plans:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error loading plans: ${error.message}`;
            }
        }
        
        function displayPlans(data) {
            const plans = data.plans || [];
            
            if (plans.length === 0) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'No plans found in the data.';
                document.getElementById('loading').style.display = 'none';
                return;
            }
            
            // Calculate statistics
            const prices = plans.map(p => p.price_monthly).filter(p => p > 0);
            const avgPrice = prices.length > 0 ? (prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(2) : 0;
            const minPrice = prices.length > 0 ? Math.min(...prices).toFixed(2) : 0;
            const maxPrice = prices.length > 0 ? Math.max(...prices).toFixed(2) : 0;
            
            // Update statistics
            document.getElementById('total-plans').textContent = plans.length;
            document.getElementById('avg-price').textContent = `$${avgPrice}`;
            document.getElementById('min-price').textContent = `$${minPrice}`;
            document.getElementById('max-price').textContent = `$${maxPrice}`;
            
            // Format and display scraped time
            const scrapedTime = new Date();
            document.getElementById('scraped-time').textContent = scrapedTime.toLocaleDateString();
            
            // Populate table
            const tbody = document.getElementById('plans-tbody');
            tbody.innerHTML = '';
            
            plans.forEach(plan => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${plan.name}</strong></td>
                    <td>${plan.speed}</td>
                    <td><span class="plan-badge">${plan.plan_duration}</span></td>
                    <td><span class="price-highlight">$${plan.price_monthly.toFixed(2)}</span></td>
                    <td>$${plan.total_cost.toFixed(2)}</td>
                    <td>
                        <ul class="features-list">
                            ${plan.features.map(f => `<li>✓ ${f}</li>`).join('')}
                        </ul>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            // Show content
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
        
        // Load plans when page loads
        window.addEventListener('DOMContentLoaded', () => {
            loadPlansData();
        });
    </script>
</body>
</html>
